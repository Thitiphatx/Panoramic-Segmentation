name: 'panoramic-segmentation'
services:
  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    volumes:
      - silo_data:/data
      - "./datasets:/datasets"
    restart: unless-stopped
    healthcheck:
      # ready checks HTTP listener + KMS/etcd; verify signed S3 I/O before dependent workloads
      test: [ "CMD", "silo", "healthcheck", "ready" ]
      interval: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis-dev-password}" ]
    restart: unless-stopped

  postgres:
    image: postgres:15.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /workspace
    devices:
      - /dev/dxg
    volumes:
      - type: bind
        source: /usr/lib/wsl/lib/libdxcore.so
        target: /usr/lib/libdxcore.so
        read_only: true
        bind:
          create_host_path: false
      - ./worker:/workspace
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      S3_ENDPOINT: silo:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - silo
      - redis
      - postgres

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /workspace
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
    environment:
      S3_ENDPOINT: silo:${S3_PORT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: false
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DATABASE}
    depends_on:
      - silo
      - redis
      - postgres

volumes:
  silo_data:
  redis_data:
  postgres_data:
